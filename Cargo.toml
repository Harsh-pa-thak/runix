[package]
name = "runix-cli"
version = "1.6.0"
edition = "2021"
authors = ["Harsh Pathak <[harphy45@gmail.com]>"]
description = "A blazing-fast CLI tool for ASCII art in your terminal"
license = "MIT"
repository = "https://github.com/Harsh-pa-thak/runix"
homepage = "https://github.com/Harsh-pa-thak/runix"
readme = "README.md"
keywords = ["ascii", "art", "cli", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "runix"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls instead of native-tls: no OpenSSL at build or run time, smaller binary.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dirs = "5"
anyhow = "1"
indicatif = "0.17"
figlet-rs = "0.1"
dotenvy = "0.15"
rand = "0.8"
terminal_size = "0.4"

# Release builds tuned for speed: cross-crate inlining, stripped, no unwinding.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
